name: SYNTRA Public Status Monitor

on:
  push:
    branches: [main]
    paths-ignore:
      - "status/data.json"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-status-monitor
  cancel-in-progress: true

jobs:
  check-public-pages:
    name: Check public website endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Check public endpoints and update status data
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          data_path = "status/data.json"
          try:
              with open(data_path, encoding="utf-8") as source:
                  previous = json.load(source)
          except (OSError, json.JSONDecodeError):
              previous = {}

          previous_by_path = {
              item.get("path"): item
              for item in previous.get("checks", [])
              if item.get("path")
          }
          base = "https://dea78799-dotcom.github.io/SYNTRA-Website"
          targets = [
              ("SYNTRA Website", "/", base + "/"),
              ("Project Hub", "/projects/", base + "/projects/"),
              ("Public Updates", "/updates/", base + "/updates/"),
              ("Changelog", "/changelog/", base + "/changelog/"),
          ]
          checks = []
          checked_at = datetime.now(timezone.utc).isoformat(timespec="seconds")
          for name, path, url in targets:
              started = time.monotonic()
              code = None
              state = "down"
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "SYNTRA-Public-Status-Monitor/1.1"},
                      method="GET",
                  )
                  with urllib.request.urlopen(request, timeout=15) as response:
                      code = response.status
                      state = "up" if 200 <= code < 400 else "down"
              except urllib.error.HTTPError as error:
                  code = error.code
                  state = "up" if 200 <= code < 400 else "down"
              except Exception:
                  state = "down"
              elapsed = round((time.monotonic() - started) * 1000)
              checks.append({
                  "name": name,
                  "path": path,
                  "status": state,
                  "http_status": code,
                  "response_ms": elapsed
              })

          history = list(previous.get("history", []))
          for item in checks:
              old = previous_by_path.get(item["path"])
              if old and old.get("status") != item["status"]:
                  history.append({
                      "timestamp": checked_at,
                      "name": item["name"],
                      "path": item["path"],
                      "from": old.get("status", "unknown"),
                      "to": item["status"],
                      "type": "resolved" if item["status"] == "up" else "incident"
                  })
          history = history[-100:]

          result = {
              "schema_version": 1,
              "monitoring": "active",
              "checked_at": checked_at,
              "checks": checks,
              "history": history
          }
          with open(data_path, "w", encoding="utf-8") as output:
              json.dump(result, output, ensure_ascii=False, indent=2)
              output.write("\\n")
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Commit latest public status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status/data.json
          if git diff --cached --quiet; then
            echo "Status data unchanged; no commit required."
          else
            git commit -m "Update public service status"
            git push
          fi
